<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      width: 220px;
    }
    h1 {
      font-size: 16px;
      text-align: center;
      margin-bottom: 15px;
    }
    button, input {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 5px;
      font-size: 14px;
    }
    #salvar { background: #4CAF50; color: white; border: none; }
    #remover { background: #E53935; color: white; border: none; }
  </style>
</head>
<body>
  <h1>Gerenciador de Grupos</h1>
  
  <!-- Botões -->
  <button id="salvar">Salvar grupos</button>
  <button id="remover">Remover grupos</button>

  <!-- Upload de arquivo -->
  <input type="file" id="arquivo" accept=".txt">

  <script src="popup.js"></script>
</body>
</html>
