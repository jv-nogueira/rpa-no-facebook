<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerenciador de Grupos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { width: 260px; padding: 10px; font-family: Arial, sans-serif; }
    .btn-block { width: 100%; margin-bottom: 10px; }
    #arquivo { font-size: 12px; padding: 2px; margin-bottom: 5px; }
    #removerArquivo { display: none; margin-bottom: 10px; }
    #mensagemUpload { font-size: 12px; color: #555; margin-bottom: 8px; text-align: center; }
  </style>
</head>
<body>
  <h5 class="text-center mb-3">Gerenciador de Grupos</h5>

  <button id="remover" class="btn btn-danger btn-block">Remover grupos</button>
  <button id="salvar" class="btn btn-success btn-block">Salvar grupos</button>

  <div id="mensagemUpload">Upload de grupos que não serão removidos</div>
  <input type="file" id="arquivo" accept=".txt" class="form-control mb-1">
  <button id="removerArquivo" class="btn btn-secondary btn-block btn-sm">Remover arquivo</button>

  <script src="popup.js"></script>
</body>
</html>
