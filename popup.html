<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerenciador de Grupos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { width: 240px; padding: 10px; font-family: Arial, sans-serif; }
    .btn-block { width: 100%; margin-bottom: 10px; }
    input[type="file"] { margin-bottom: 10px; }
  </style>
</head>
<body>
  <h5 class="text-center mb-3">Gerenciador de Grupos</h5>

  <button id="remover" class="btn btn-danger btn-block">Remover grupos</button>
  <button id="salvar" class="btn btn-success btn-block">Salvar grupos</button>

  <input type="file" id="arquivo" accept=".txt" class="form-control mb-2">

  <script src="popup.js"></script>
</body>
</html>
